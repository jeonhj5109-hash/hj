<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>업무포털시스템 로그인</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'맑은 고딕',sans-serif; background:#eef1f5; height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-box { background:#fff; border:1px solid #ccc; width:360px; }
        .login-box .header { background:#1a3c6e; color:#fff; padding:18px 24px; font-size:15px; font-weight:bold; }
        .login-box .body { padding:30px 24px; }
        .login-box label { display:block; font-size:12px; color:#555; margin-bottom:4px; }
        .login-box input { width:100%; padding:9px; margin-bottom:14px; border:1px solid #ccc; font-size:13px; }
        .login-box button { width:100%; padding:10px; background:#1a3c6e; color:#fff; border:none; font-size:13px; cursor:pointer; }
        .login-box button:hover { background:#142f57; }
        .msg { font-size:12px; color:#c0392b; margin-top:8px; min-height:16px; }
        .footer-note { font-size:11px; color:#999; margin-top:16px; text-align:center; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="header"><i>🔒</i> 업무포털시스템</div>
    <div class="body">
        <label>사번</label>
        <input type="text" id="userId" value="emp001">
        <button onclick="login()">로그인</button>
        <div class="msg" id="msg"></div>
        <div class="footer-note">접속 포트: <span id="port"></span></div>
    </div>
</div>

<script>
    document.getElementById('port').textContent = location.port;

    function login() {
        const userId = document.getElementById('userId').value;
        fetch('/jboss-leak-test-0.0.1-SNAPSHOT/api/login', {
            method: 'POST',
            headers: {'Content-Type':'application/x-www-form-urlencoded'},
            body: 'userId=' + encodeURIComponent(userId)
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) location.href = 'main.html';
            })
            .catch(() => {
                document.getElementById('msg').textContent = '⚠️ 로그인 서버 응답 없음';
            });
    }
</script>
</body>
</html>
